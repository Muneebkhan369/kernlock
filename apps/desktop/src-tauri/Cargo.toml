[package]
name = "kernlock-desktop"
version = "0.1.0"
description = "KernLock Security Desktop Application"
authors = ["KernLock Security Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kernlock-core = { path = "../../../crates/kernlock-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
