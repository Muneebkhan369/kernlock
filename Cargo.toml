[workspace]
resolver = "2"
members = [
    "crates/kernlock-core",
    "crates/kernlock-storage",
    "crates/kernlock-quarantine",
    "crates/kernlock-platform",
    "crates/kernlock-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["KernLock Security Contributors"]
repository = "https://github.com/Muneebkhan369/kernlock"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
