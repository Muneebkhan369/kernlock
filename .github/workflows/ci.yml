name: KernLock CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build-and-test:
    name: Linux (Ubuntu) Test, Lint, UI & Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify desktop sidecar and build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:sidecar
          npm run build

      - name: Build Debian release package
        run: |
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh
          ls -lh target/debian/*.deb

  linux-privileged-acceptance:
    name: Linux Privileged Fanotify Acceptance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run privileged fanotify acceptance test with root privileges
        run: |
          chmod +x scripts/test-privileged-linux.sh
          ./scripts/test-privileged-linux.sh

  windows-build-and-test:
    name: Windows Test & Minifilter Driver Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Windows platform and core tests
        run: cargo test -p kernlock-core -p kernlock-storage -p kernlock-quarantine -p kernlock-platform --test windows_tests

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore crates/kernlock-platform/driver/windows/packages.config -PackagesDirectory crates/kernlock-platform/driver/windows/packages

      - name: Build Minifilter Driver (kernlock_filter.sys)
        shell: pwsh
        run: |
          # Add WDK bin path to PATH so stampinf.exe and related tools can be located by Tracker/MSBuild
          $wdkBin = Resolve-Path "crates/kernlock-platform/driver/windows/packages/Microsoft.Windows.WDK.x64.*/c/bin/10.0.28000.0/x64" -ErrorAction SilentlyContinue
          if ($wdkBin) {
            Write-Host "Adding WDK tools to PATH: $($wdkBin.Path)"
            $env:PATH = "$($wdkBin.Path);$env:PATH"
          }
          msbuild crates/kernlock-platform/driver/windows/kernlock_filter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:SignMode=Off

      - name: Verify Minifilter Driver binary exists
        shell: pwsh
        run: |
          $driverFiles = Get-ChildItem -Path crates/kernlock-platform/driver/windows -Recurse -Filter kernlock_filter.sys
          if ($driverFiles.Count -eq 0) {
            $driverFiles = Get-ChildItem -Path . -Recurse -Filter kernlock_filter.sys
          }
          if ($driverFiles.Count -eq 0) {
            Write-Error "kernlock_filter.sys was not produced by MSBuild!"
            exit 1
          }
          $driver = $driverFiles[0]
          Write-Host "Found driver binary at: $($driver.FullName)"
          Write-Host "File size: $($driver.Length) bytes"
          if ($driver.Length -le 0) {
            Write-Error "kernlock_filter.sys exists but is empty!"
            exit 1
          }

  macos-build-and-test:
    name: macOS Test & Endpoint Security Client Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run macOS platform and core tests
        run: cargo test -p kernlock-core -p kernlock-storage -p kernlock-quarantine -p kernlock-platform --test macos_tests

      - name: Compile Apple EndpointSecurity C Client
        run: |
          mkdir -p target
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "Using macOS SDK at: $SDK_PATH"
          clang -Wall -Wextra -Werror -fblocks \
            -isysroot "$SDK_PATH" \
            -L"$SDK_PATH/usr/lib" \
            -lEndpointSecurity -framework Foundation \
            crates/kernlock-platform/extension/macos/main.c \
            -o target/kernlock_es_client
          ls -la target/kernlock_es_client

      - name: Build macOS System Extension Xcode Project
        run: |
          xcodebuild -project crates/kernlock-platform/extension/macos/KernLockExtension.xcodeproj \
            -target KernLockExtension \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify macOS System Extension binary exists
        run: |
          if [ ! -f target/kernlock_es_client ]; then
            echo "ERROR: target/kernlock_es_client not found!"
            exit 1
          fi
          EXT_PATH=$(find . -name "com.kernlock.security.dext" -o -name "com.kernlock.security.dext.systemextension" | head -n 1)
          if [ -z "$EXT_PATH" ]; then
            echo "ERROR: com.kernlock.security.dext extension bundle not found!"
            exit 1
          fi
          echo "Found macOS System Extension at: $EXT_PATH"
          ls -la "$EXT_PATH"
