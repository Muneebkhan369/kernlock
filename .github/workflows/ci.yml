name: KernLock CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build-and-test:
    name: Linux (Ubuntu) Test, Lint, UI & Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify desktop sidecar and build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:sidecar
          npm run build

      - name: Build Debian release package
        run: |
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh
          ls -lh target/debian/*.deb

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernlock-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  linux-privileged-acceptance:
    name: Linux Privileged Fanotify Acceptance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run privileged fanotify acceptance test with root privileges
        run: |
          chmod +x scripts/test-privileged-linux.sh
          ./scripts/test-privileged-linux.sh

  windows-build-and-test:
    name: Windows Test & Minifilter Driver Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Windows platform and core tests
        run: cargo test -p kernlock-core -p kernlock-storage -p kernlock-quarantine -p kernlock-platform --test windows_tests

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore crates/kernlock-platform/driver/windows/packages.config -PackagesDirectory crates/kernlock-platform/driver/windows/packages

      - name: Build Minifilter Driver (kernlock_filter.sys)
        shell: pwsh
        run: |
          # Add WDK bin paths (both x64 and x86) to PATH so stampinf.exe and related tools can be located
          $wdkX64 = Resolve-Path "crates/kernlock-platform/driver/windows/packages/Microsoft.Windows.WDK.x64.*/c/bin/10.0.28000.0/x64" -ErrorAction SilentlyContinue
          $wdkX86 = Resolve-Path "crates/kernlock-platform/driver/windows/packages/Microsoft.Windows.WDK.x64.*/c/bin/10.0.28000.0/x86" -ErrorAction SilentlyContinue
          if ($wdkX86) { $env:PATH = "$($wdkX86.Path);$env:PATH" }
          if ($wdkX64) { $env:PATH = "$($wdkX64.Path);$env:PATH" }
          msbuild crates/kernlock-platform/driver/windows/kernlock_filter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:SignMode=Off /p:EnableInfVerif=false /p:EnableApiValidator=false /p:EnableInf2Cat=false

      - name: Verify Minifilter Driver binary exists
        shell: pwsh
        run: |
          $driverFiles = Get-ChildItem -Path crates/kernlock-platform/driver/windows -Recurse -Filter kernlock_filter.sys
          if ($driverFiles.Count -eq 0) {
            $driverFiles = Get-ChildItem -Path . -Recurse -Filter kernlock_filter.sys
          }
          if ($driverFiles.Count -eq 0) {
            Write-Error "kernlock_filter.sys was not produced by MSBuild!"
            exit 1
          }
          $driver = $driverFiles[0]
          Write-Host "Found driver binary at: $($driver.FullName)"
          Write-Host "File size: $($driver.Length) bytes"
          if ($driver.Length -le 0) {
            Write-Error "kernlock_filter.sys exists but is empty!"
            exit 1
          }

      - name: Validate INF and Generate Catalog (Inf2Cat)
        shell: pwsh
        run: |
          $driverFiles = Get-ChildItem -Path crates/kernlock-platform/driver/windows -Recurse -Filter kernlock_filter.sys
          if ($driverFiles.Count -eq 0) {
            $driverFiles = Get-ChildItem -Path . -Recurse -Filter kernlock_filter.sys
          }
          $driver = $driverFiles[0]
          $driverDir = Split-Path $driver.FullName
          $infFile = Join-Path $driverDir "kernlock_filter.inf"
          if (!(Test-Path $infFile)) {
            Copy-Item "crates/kernlock-platform/driver/windows/kernlock_filter.inf" $infFile
          }
          Write-Host "Verifying INF at: $infFile"
          $inf2cat = (Get-Command inf2cat.exe -ErrorAction SilentlyContinue).Source
          if (!$inf2cat) {
            $inf2cat = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter inf2cat.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if ($inf2cat) {
            Write-Host "Running Inf2Cat: $inf2cat"
            & $inf2cat /driver:$driverDir /os:10_X64
          } else {
            Write-Warning "Inf2Cat not found in default paths; skipping catalog generation"
          }

      - name: Create Test Certificate and Test-Sign Driver
        shell: pwsh
        run: |
          $driverFiles = Get-ChildItem -Path crates/kernlock-platform/driver/windows -Recurse -Filter kernlock_filter.sys
          if ($driverFiles.Count -eq 0) {
            $driverFiles = Get-ChildItem -Path . -Recurse -Filter kernlock_filter.sys
          }
          $driver = $driverFiles[0]
          $driverDir = Split-Path $driver.FullName
          Write-Host "Creating local self-signed code signing certificate for test driver..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=KernLock Security Test Driver" -CertStoreLocation "Cert:\CurrentUser\My"
          $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (!$signTool) {
            $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if ($signTool) {
            Write-Host "Signing driver binary ($($driver.FullName))..."
            & $signTool sign /v /s My /n "KernLock Security Test Driver" /fd SHA256 "$($driver.FullName)"
            $catFile = Join-Path $driverDir "kernlock_filter.cat"
            if (Test-Path $catFile) {
              Write-Host "Signing catalog ($catFile)..."
              & $signTool sign /v /s My /n "KernLock Security Test Driver" /fd SHA256 $catFile
            }
          } else {
            Write-Warning "signtool.exe not found in default paths; skipping test-signing"
          }

      - name: Upload Windows Minifilter Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernlock-windows-driver
          path: |
            crates/kernlock-platform/driver/windows/**/kernlock_filter.sys
            crates/kernlock-platform/driver/windows/**/kernlock_filter.inf
            crates/kernlock-platform/driver/windows/**/kernlock_filter.cat
          if-no-files-found: warn

  macos-build-and-test:
    name: macOS Test & Endpoint Security Client Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run macOS platform and core tests
        run: cargo test -p kernlock-core -p kernlock-storage -p kernlock-quarantine -p kernlock-platform --test macos_tests

      - name: Compile Apple EndpointSecurity C Client
        run: |
          mkdir -p target
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "Using macOS SDK at: $SDK_PATH"
          clang -Wall -Wextra -Werror -fblocks \
            -isysroot "$SDK_PATH" \
            -L"$SDK_PATH/usr/lib" \
            -lEndpointSecurity -lbsm -framework Foundation \
            crates/kernlock-platform/extension/macos/main.c \
            -o target/kernlock_es_client
          ls -la target/kernlock_es_client

      - name: Build macOS System Extension Xcode Project
        run: |
          xcodebuild -project crates/kernlock-platform/extension/macos/KernLockExtension.xcodeproj \
            -target KernLockExtension \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify macOS System Extension binary exists
        run: |
          if [ ! -f target/kernlock_es_client ]; then
            echo "ERROR: target/kernlock_es_client not found!"
            exit 1
          fi
          EXT_PATH=$(find . -name "com.kernlock.security.dext" -o -name "com.kernlock.security.dext.systemextension" | head -n 1)
          if [ -z "$EXT_PATH" ]; then
            echo "ERROR: com.kernlock.security.dext extension bundle not found!"
            exit 1
          fi
          echo "Found macOS System Extension at: $EXT_PATH"
          ls -la "$EXT_PATH"

      - name: Validate Endpoint Security Entitlements & Bundle Layout
        run: |
          ENT_FILE="crates/kernlock-platform/extension/macos/com.kernlock.security.dext/kernlock.entitlements"
          if ! grep -q "com.apple.developer.endpoint-security.client" "$ENT_FILE"; then
            echo "ERROR: Missing com.apple.developer.endpoint-security.client entitlement in $ENT_FILE"
            exit 1
          fi
          echo "Endpoint Security entitlement verified in $ENT_FILE"
          EXT_PATH=$(find . -name "com.kernlock.security.dext" -o -name "com.kernlock.security.dext.systemextension" | head -n 1)
          if [ -z "$EXT_PATH" ]; then
            echo "ERROR: System extension bundle not found!"
            exit 1
          fi
          echo "Verifying extension bundle structure at $EXT_PATH"
          if [ ! -d "$EXT_PATH/Contents/MacOS" ]; then
            echo "ERROR: Missing Contents/MacOS directory in $EXT_PATH"
            exit 1
          fi
          ls -la "$EXT_PATH/Contents/MacOS"

      - name: Upload macOS Endpoint Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernlock-macos-extension
          path: |
            target/kernlock_es_client
            **/com.kernlock.security.dext*
          if-no-files-found: warn
